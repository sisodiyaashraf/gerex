name: gerex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  get_it: ^7.6.0
  go_router: ^13.2.0
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^5.0.2
  google_sign_in: ^6.3.0
  flutter_secure_storage: ^9.2.4
  google_generative_ai: ^0.2.2
  google_mlkit_pose_detection: ^0.12.0
  camera: ^0.10.5
  video_player: ^2.8.2
  google_fonts: ^8.2.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.1
  health: ^13.3.1
  flutter_blue_plus: ^2.3.11
  permission_handler: ^12.0.3
  sensors_plus: ^7.1.0
  flutter_tts: ^4.2.5
  google_mlkit_barcode_scanning: ^0.12.1
  google_mlkit_image_labeling: ^0.12.0
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app icon/gerex-app-icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/app icon/
    - assets/images/gerex smartwatch.png
    - assets/images/meal_icon.png
    - assets/images/explore_icon.png
    - assets/images/analytics_icon.png
    - assets/images/breakfast_icon.png
    - assets/images/dinner_icon.png
    - assets/images/lunch_icon.png
    - assets/images/snack_icon.png
    - assets/svg icons/
    - assets/exercise/
    - assets/data/exercises.json
    - assets/videos/
